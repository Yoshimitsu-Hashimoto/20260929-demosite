<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>お問い合わせ | 株式会社ひなた</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header"><a class="brand" href="index.html">株式会社ひなた</a><nav class="main-nav" aria-label="メインナビゲーション"><a href="index.html#services">事業内容</a><a href="works.html">制作実績</a><a href="company.html">会社案内</a><a href="index.html#news">お知らせ</a><a class="nav-contact" href="contact.html" aria-current="page">お問い合わせ</a></nav></header>
<main><div class="container breadcrumb"><a href="index.html">トップ</a>　›　お問い合わせ</div><div class="page-title"><h1>お問い合わせ</h1><span class="eyebrow">CONTACT</span></div><div class="container page-main"><p class="lead">Webサイトの制作・リニューアル、運用のご相談など、お気軽にお問い合わせください。<br>必須項目をご入力のうえ、送信してください。</p>
<form class="contact-form" action="thanks.html" method="get">
<div class="form-row"><label for="name">お名前 <span class="required">必須</span></label><input id="name" name="name" type="text" autocomplete="name" placeholder="例：山田 太郎" required></div>
<div class="form-row"><label for="email">メールアドレス <span class="required">必須</span></label><input id="email" name="email" type="email" autocomplete="email" placeholder="例：yamada@example.com" required></div>
<div class="form-row"><label for="message">お問い合わせ内容 <span class="required">必須</span></label><textarea id="message" name="message" placeholder="ご相談内容をご記入ください。" required></textarea></div>
<div class="consent"><label><input type="checkbox" name="consent" value="agree" required> <a href="privacy.html">プライバシーポリシー</a>に同意する <span class="required">必須</span></label><small>送信前に個人情報の取り扱いをご確認ください。</small></div>
<div class="form-actions"><button class="button" type="submit">送信する　→</button><p class="demo-notice">このフォームは講座用デモです。テスト用の情報を入力してください。</p></div>
</form></div></main>
<footer class="site-footer"><div class="footer-inner"><a class="footer-brand" href="index.html">株式会社ひなた</a><div class="footer-links"><a href="company.html">会社案内</a><a href="contact.html">お問い合わせ</a><a href="privacy.html">プライバシーポリシー</a><span class="footer-note">講座用デモサイト・架空の企業です。</span></div></div></footer></body></html>
